[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
pythonpath = .

addopts =
    -ra
    --strict-markers
    --html=reports/report.html
    --self-contained-html

markers =
    smoke: quick, critical-path checks
    regression: full functional coverage
    login: login / logout scenarios
    negative: invalid input and error handling

log_cli = false
log_cli_level = INFO
